---
# role: environment
# file: molecule/resources/playbooks/prepare.yml

- name: ENVIRONMENT | Prepare existing configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: ENVIRONMENT | Wait for test instances to become reachable
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: ENVIRONMENT | Create environment consumer
      become: true
      become_user: root
      ansible.builtin.user:
        name: environment_molecule
        system: true
        home: /home/environment_molecule
        create_home: true

    - name: ENVIRONMENT | Seed duplicate login assignments
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/environment
        content: |
          # Unmanaged configuration must survive convergence.
          ENVIRONMENT_TEST_UNMANAGED="preserved"
          ENVIRONMENT_TEST_VALUE="initial"
          ENVIRONMENT_TEST_VALUE="stale"
        owner: root
        group: root
        mode: "0644"

    - name: ENVIRONMENT | Seed inaccessible drop-in directory
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/environment.d
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: ENVIRONMENT | Seed inaccessible drop-in
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/environment.d/90-environment-molecule.conf
        content: |
          ENVIRONMENT_TEST_DROPIN="stale"
        owner: root
        group: root
        mode: "0640"
