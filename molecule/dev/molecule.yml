---
# role: environment
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    prepare: "../resources/playbooks/prepare.yml"
  inventory:
    group_vars:
      all:
        environment_vars:
          ENVIRONMENT_TEST_VALUE: "initial"
          ENVIRONMENT_TEST_EMPTY: ""
          ENVIRONMENT_TEST_SPACES: "space = and Grüße"
        environment_d_files:
          - name: "90-environment-molecule.conf"
            entries:
              ENVIRONMENT_TEST_DROPIN: "initial drop-in"
              ENVIRONMENT_TEST_ESCAPED: "quotes \"double\" and 'single', backslash \\, trailing \\"
        __environment_expected:
          ENVIRONMENT_TEST_VALUE: "initial"
          ENVIRONMENT_TEST_EMPTY: ""
          ENVIRONMENT_TEST_SPACES: "space = and Grüße"
          ENVIRONMENT_TEST_DROPIN: "initial drop-in"
          ENVIRONMENT_TEST_ESCAPED: "quotes \"double\" and 'single', backslash \\, trailing \\"
          ENVIRONMENT_TEST_UNMANAGED: "preserved"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "check"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "destroy"
  name: "dev"
platforms:
  - name: "almalinux-latest-environment"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "debian-latest-environment"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "fedora-latest-environment"
    image: "docker.io/jomrr/molecule-fedora:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "opensuse-leap-latest-environment"
    image: "docker.io/jomrr/molecule-opensuse-leap:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "opensuse-tumbleweed-latest-environment"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "ubuntu-latest-environment"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
